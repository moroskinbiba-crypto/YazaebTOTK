name: TOTK Explorer Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify toolchain
        run: |
          set -eux
          test -n "${DEVKITPRO}"
          test -d "${DEVKITPRO}/libnx"
          test -d "${DEVKITPRO}/devkitA64"
          echo "--- devkitA64/bin ---"
          ls -la "${DEVKITPRO}/devkitA64/bin" || true
          echo "--- candidate compilers ---"
          find "${DEVKITPRO}/devkitA64" -maxdepth 3 -type f \( -name "*g++*" -o -name "*gcc*" \) -print | head -80
          echo "${DEVKITPRO}/devkitA64/bin" >> "$GITHUB_PATH"
          command -v make
          command -v elf2nro
          test -f "${DEVKITPRO}/libnx/switch_rules"

      - name: Get compatible libtesla
        run: |
          set -eux
          rm -rf /tmp/Status-Monitor-Deux libs/libtesla
          git clone --filter=blob:none --no-checkout https://github.com/masagrator/Status-Monitor-Deux.git /tmp/Status-Monitor-Deux
          git -C /tmp/Status-Monitor-Deux checkout --detach 23a97111808d74993ece25b8bab79402fa2d7880
          mkdir -p libs
          cp -a /tmp/Status-Monitor-Deux/lib/libtesla libs/libtesla
          test -s libs/libtesla/include/tesla.hpp
          test -s libs/libtesla/include/ini_funcs.hpp
          test -s libs/libtesla/include/stb_truetype.h

      - name: Get dmnt:cht
        run: |
          set -eux
          rm -rf /tmp/Shiny-Stash-Live-Map
          git clone --filter=blob:none --no-checkout https://github.com/Insektaure/Shiny-Stash-Live-Map.git /tmp/Shiny-Stash-Live-Map
          git -C /tmp/Shiny-Stash-Live-Map checkout --detach 548896d0cc3b5fd531bd970f0708ecda13338492
          mkdir -p libs include/switch
          cp /tmp/Shiny-Stash-Live-Map/lib/libdmntcht.a libs/libdmntcht.a
          cp /tmp/Shiny-Stash-Live-Map/include/switch/dmntcht.h include/switch/dmntcht.h
          test -s libs/libdmntcht.a
          test -s include/switch/dmntcht.h

      - name: Verify project layout
        run: |
          set -eux
          test -f Makefile
          test -f data/points.csv
          test -f include/explorer.hpp
          test -f source/main.cpp
          test -f source/memory.cpp
          test -f source/map.cpp
          test -f source/ui.cpp

      - name: Build
        run: |
          set -eux
          make clean
          make -j2
          test -s TOTK-Explorer-v3.ovl

      - name: Package
        run: |
          set -eux
          rm -rf artifact
          mkdir -p artifact/sd/switch/.overlays
          cp TOTK-Explorer-v3.ovl artifact/sd/switch/.overlays/
          mkdir -p artifact/sd/switch/totk_explorer
          cp data/points.csv artifact/sd/switch/totk_explorer/
          test -s artifact/sd/switch/.overlays/TOTK-Explorer-v3.ovl
          test -s artifact/sd/switch/totk_explorer/points.csv

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TOTK-Explorer-v3
          path: artifact
          include-hidden-files: true
