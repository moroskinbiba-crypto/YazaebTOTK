name: TOTK Explorer Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: totk-explorer-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify toolchain
        run: |
          set -eux
          test -n "${DEVKITPRO}"
          test -d "${DEVKITPRO}/libnx"
          test -d "${DEVKITPRO}/devkitA64"
          echo "--- devkitA64/bin ---"
          ls -la "${DEVKITPRO}/devkitA64/bin" || true
          echo "--- candidate compilers ---"
          find "${DEVKITPRO}/devkitA64" -maxdepth 3 -type f \( -name "*g++*" -o -name "*gcc*" \) -print | head -80
          echo "${DEVKITPRO}/devkitA64/bin" >> "$GITHUB_PATH"
          command -v make
          command -v elf2nro
          test -f "${DEVKITPRO}/libnx/switch_rules"

      - name: Get libultrahand
        run: |
          set -eux
          rm -rf /tmp/libultrahand libs/libultrahand
          git clone --filter=blob:none --no-checkout https://github.com/ppkantorski/libultrahand.git /tmp/libultrahand
          git -C /tmp/libultrahand checkout --detach 856ddbddd796fc4a59ad2e0bf939c5963e6f9dd2
          mkdir -p libs/libultrahand
          cp -a /tmp/libultrahand/ultrahand.mk libs/libultrahand/
          cp -a /tmp/libultrahand/common libs/libultrahand/
          cp -a /tmp/libultrahand/libultra libs/libultrahand/
          cp -a /tmp/libultrahand/libtesla libs/libultrahand/
          test -s libs/libultrahand/ultrahand.mk
          test -s libs/libultrahand/libtesla/include/tesla.hpp
          test -s libs/libultrahand/libtesla/include/ini_funcs.hpp
          test -s libs/libultrahand/libtesla/include/stb_truetype.h

      - name: Get dmnt:cht
        run: |
          set -eux
          rm -rf /tmp/Shiny-Stash-Live-Map
          git clone --filter=blob:none --no-checkout https://github.com/Insektaure/Shiny-Stash-Live-Map.git /tmp/Shiny-Stash-Live-Map
          git -C /tmp/Shiny-Stash-Live-Map checkout --detach 548896d0cc3b5fd531bd970f0708ecda13338492
          mkdir -p libs include/switch
          cp /tmp/Shiny-Stash-Live-Map/lib/libdmntcht.a libs/libdmntcht.a
          cp /tmp/Shiny-Stash-Live-Map/include/switch/dmntcht.h include/switch/dmntcht.h
          test -s libs/libdmntcht.a
          test -s include/switch/dmntcht.h

      - name: Verify project layout
        run: |
          set -eux
          test -f Makefile
          test -f data/points.csv
          test -f include/explorer.hpp
          test -f source/main.cpp
          test -f source/memory.cpp
          test -f source/map.cpp
          test -f source/ui.cpp
          test -f source/log.cpp
          test -f libs/libultrahand/ultrahand.mk
          test -d libs/libultrahand/common
          test -d libs/libultrahand/libultra/source
          test -f libs/libultrahand/libtesla/include/tesla.hpp

      - name: Build
        run: |
          set -eux
          make clean
          make -j2
          test -s TOTK-Explorer-v3.ovl
          awk -F, 'NF && !/^#/ { if (NF != 6) exit 1; n++ } END { if (n != 152) exit 1 }' data/points.csv
          awk -F, 'NF && !/^#/ && $6 !~ /^(Surface|Sky|Depths)$/ { exit 1 }' data/points.csv
          awk -F, 'NF && $2 == "Kyononis Shrine" { if ($3 != -205 || $4 != 451 || $5 != 35 || $6 != "Surface") exit 1; found=1 } END { if (!found) exit 1 }' data/points.csv
          awk -F, 'NF && $2 == "Ukouh Shrine" { if ($3 != 275 || $4 != -913 || $5 != 1474 || $6 != "Sky") exit 1; found=1 } END { if (!found) exit 1 }' data/points.csv
          test "$(grep -cv '^#' data/points.csv)" -eq 152
          printf 'ULTR' > /tmp/ultr_signature
          tail -c 4 TOTK-Explorer-v3.ovl | cmp - /tmp/ultr_signature

      - name: Package
        run: |
          set -eux
          rm -rf artifact
          mkdir -p artifact/sd/switch/.overlays
          cp TOTK-Explorer-v3.ovl artifact/sd/switch/.overlays/
          mkdir -p artifact/sd/switch/totk_explorer
          cp data/points.csv artifact/sd/switch/totk_explorer/
          test -s artifact/sd/switch/.overlays/TOTK-Explorer-v3.ovl
          test -s artifact/sd/switch/totk_explorer/points.csv

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: TOTK-Explorer-v3
          path: artifact
          include-hidden-files: true
