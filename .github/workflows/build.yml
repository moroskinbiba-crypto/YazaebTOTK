name: TOTK Explorer — Stage 1

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: totk-explorer-stage1
  cancel-in-progress: true

jobs:
  build-stage1:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify fixed toolchain
        shell: bash
        run: |
          set -euxo pipefail
          test -n "${DEVKITPRO}"
          test -d "${DEVKITPRO}/libnx"
          test -d "${DEVKITPRO}/devkitA64"

          command -v dkp-pacman
          echo "devkitA64:"
          dkp-pacman -Q devkitA64
          echo "libnx:"
          dkp-pacman -Q libnx

          test "$(dkp-pacman -Q devkitA64 | awk '{print $2}' | cut -d- -f1 | sed 's/^r//')" = "29.2"
          test "$(dkp-pacman -Q libnx | awk '{print $2}' | cut -d- -f1)" = "4.12.0"

          command -v make
          command -v elf2nro
          test -f "${DEVKITPRO}/libnx/switch_rules"

      - name: Get pinned libultrahand/libtesla
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/libultrahand libs/libultrahand
          git clone --filter=blob:none --no-checkout https://github.com/ppkantorski/libultrahand.git /tmp/libultrahand
          git -C /tmp/libultrahand checkout --detach 1b7a64a4d73489c870f3fb9caa9927e9a2347478

          mkdir -p libs/libultrahand
          cp -a /tmp/libultrahand/ultrahand.mk libs/libultrahand/
          cp -a /tmp/libultrahand/common libs/libultrahand/
          cp -a /tmp/libultrahand/libultra libs/libultrahand/
          cp -a /tmp/libultrahand/libtesla libs/libultrahand/

          test "$(git -C /tmp/libultrahand rev-parse HEAD)" = "1b7a64a4d73489c870f3fb9caa9927e9a2347478"
          test -s libs/libultrahand/ultrahand.mk
          test -s libs/libultrahand/libtesla/include/tesla.hpp
          grep -R "TESLA" -n libs/libultrahand/libtesla/include/tesla.hpp >/dev/null

      - name: Verify Stage 1 shape
        shell: bash
        run: |
          set -euxo pipefail
          test -f Makefile
          test -f source/main.cpp
          test "$(find source -maxdepth 1 -type f -name '*.cpp' | wc -l)" -eq 1
          test "$(find source -maxdepth 1 -type f \( -name 'memory.cpp' -o -name 'map.cpp' -o -name 'ui.cpp' -o -name 'log.cpp' \) | wc -l)" -eq 0
          test "$(find . -maxdepth 2 -type f -name 'explorer.hpp' | wc -l)" -eq 0
          ! grep -R -E "dmntcht|PersistentHudGui|requestForeground|setNextOverlay|heap scan|Player actor|nearby\(" source include 2>/dev/null
          grep -F 'KEY_B' source/main.cpp >/dev/null
          grep -F 'TOTK Explorer' source/main.cpp >/dev/null

      - name: Build Stage 1
        shell: bash
        run: |
          set -euxo pipefail
          make clean
          make -j2

          test -s TOTK-Explorer.nro
          test -s TOTK-Explorer.ovl

          printf 'ULTR' > /tmp/ultr_signature
          tail -c 4 TOTK-Explorer.ovl | cmp - /tmp/ultr_signature
          test "$(stat -c%s TOTK-Explorer.ovl)" -eq "$(( $(stat -c%s TOTK-Explorer.nro) + 4 ))"
          cmp -n "$(stat -c%s TOTK-Explorer.nro)" TOTK-Explorer.nro TOTK-Explorer.ovl

          strings -a TOTK-Explorer.nro | grep -F "TOTK Explorer" >/dev/null
          strings -a TOTK-Explorer.nro | grep -F "Stage 1" >/dev/null
          ! strings -a TOTK-Explorer.nro | grep -E "dmnt:cht|PersistentHudGui|Resolver step|Player actor" >/dev/null

      - name: Package
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf artifact
          mkdir -p artifact/sd/switch/.overlays
          cp TOTK-Explorer.ovl artifact/sd/switch/.overlays/
          test -s artifact/sd/switch/.overlays/TOTK-Explorer.ovl

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: TOTK-Explorer-stage1
          path: artifact
          include-hidden-files: true
